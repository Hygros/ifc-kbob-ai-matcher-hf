[server]
headless = true
address = "0.0.0.0"
port = 7860
fileWatcherType = "none"
# With XSRF protection enabled, Streamlit enforces CORS handling.
enableCORS = true
enableStaticServing = true
# Direct Streamlit serving on HF: keep XSRF protection enabled.
enableXsrfProtection = true

[browser]
gatherUsageStats = false
